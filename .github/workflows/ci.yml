name: Exercise 1 checks

on: [push, pull_request]

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install the pinned Lean distribution
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Check the reviewed environment fixtures
        run: python -m scripts.check_environment
      - name: Run Python and real Lean acceptance tests for this exercise
        run: python -m unittest discover -s tests -v
        env:
          RUN_LEAN_INTEGRATION: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-01-environment-report
          path: runs/exercise01/environment.json
