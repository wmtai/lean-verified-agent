name: checks

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m agent tasks
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/build-verifier.sh
      - name: Check candidate term boundaries with real Lean in Docker
        run: python -m unittest discover -s tests -p test_candidate_boundary.py -v
        env:
          RUN_LEAN_INTEGRATION: '1'
          LEAN_TEST_BACKEND: docker
      - run: python -m agent check-fixtures
      - run: python -m agent demo
